<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva - Cevichería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/reservacion.css">
</head>

<body class="bg-light">
    <div class="wizard-header d-flex mb-0">
        <div class="wizard-step current">Cuando</div>
        <div class="wizard-step pending">Seleccionar</div>
        <div class="wizard-step pending">Confirmar</div>
    </div>

    <div class="p-3">
        <a href="inicio.html" class="btn btn-light border-dark border-2 fw-bold text-uppercase">
            ← Volver al Inicio
        </a>
    </div>

    <div id="seccion-cuando">
        <div class="main-wizard-box p-4 bg-white">
            <h1 class="text-center wizard-title">Horario</h1>
            <div class="calendar-outer-box p-3">
                <div id="calendar"></div>
            </div>
        </div>
    </div>

    <div id="seccion-seleccionar" style="display: none;">
        <div class="main-wizard-box p-4 bg-white">
            <h1 class="text-center wizard-title">Seleccionar</h1>
            <div class="calendar-outer-box p-4">
                <h4 class="text-center mb-4">¿Cuántas personas?</h4>
                <div class="d-flex justify-content-center gap-3 mb-5">
                    <button class="btn btn-outline-dark border-2 fw-bold px-4 py-3">1</button>
                    <button class="btn btn-outline-dark border-2 fw-bold px-4 py-3">2</button>
                    <button class="btn btn-outline-dark border-2 fw-bold px-4 py-3 active">4</button>
                    <button class="btn btn-outline-dark border-2 fw-bold px-4 py-3">6+</button>
                </div>
                <div class="d-flex justify-content-between mt-5">
                    <button class="btn btn-outline-secondary border-2 fw-bold" onclick="atrasACuando()">
                        ← REGRESAR
                    </button>
                    <button class="btn btn-dark border-2 fw-bold px-5" onclick="siguienteAConfirmar()">
                        SIGUIENTE →
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalReserva" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-dark border-2">
                <div class="modal-header bg-light border-bottom border-dark">
                    <h5 class="modal-title fw-bold">Detalles para el <span id="fechaSeleccionada"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label class="fw-bold mb-2">Selecciona la hora:</label>
                    <div class="d-flex flex-wrap gap-2 mb-4">
                        <button class="btn btn-outline-dark btn-sm rounded-pill">12:30 PM</button>
                        <button class="btn btn-outline-dark btn-sm rounded-pill">1:30 PM</button>
                        <button class="btn btn-outline-dark btn-sm rounded-pill">2:30 PM</button>
                    </div>
                    <label class="fw-bold mb-2">Ubicación de la mesa:</label>
                    <select class="form-select border-dark mb-4">
                        <option value="pisos">Mesas en salón (Pisos generales)</option>
                        <option value="terraza">Alquiler de Terraza (Privado)</option>
                    </select>
                    <div class="form-check form-switch p-3 bg-light border rounded">
                        <input class="form-check-input ms-0 me-2" type="checkbox" id="modalCumple">
                        <label class="form-check-label fw-bold" for="modalCumple">¿Es para un cumpleaños?</label>
                    </div>
                </div>
                <div class="modal-footer border-top border-dark">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary px-4" onclick="irASeleccionar()">Siguiente</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <script src="js/reservacion.js"></script>
</body>

</html>
